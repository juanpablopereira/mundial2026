// ─── UTILS ────────────────────────────────────────────────────────────────────
function matchUTC(m) {
  const [home,away,dateStr,localHour,offset] = m;
  const off = (typeof offset === 'string') ? -6 : offset;
  const [y,mm,d] = dateStr.split('-').map(Number);
  const totalMins = Math.round(localHour * 60);
  const h = Math.floor(totalMins/60);
  const mins = totalMins % 60;
  return new Date(Date.UTC(y, mm-1, d, h - off, mins));
}

function fmt(dt, tzOff) {
  const local = new Date(dt.getTime() + tzOff*3600*1000);
  return local.getUTCHours().toString().padStart(2,'0') + ':' + local.getUTCMinutes().toString().padStart(2,'0');
}

const WEEKDAYS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MONTHS   = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

function fmtDate(dt, tzOff) {
  const local = new Date(dt.getTime() + tzOff*3600*1000);
  return { dow: WEEKDAYS[local.getUTCDay()], day: `${local.getUTCDate()} ${MONTHS[local.getUTCMonth()]} 2026` };
}

// Google Calendar "Add event" URL
// dates format: YYYYMMDDTHHmmSSZ
function gcalUrl(title, startUtc, endUtc, location, details) {
  const fmt = d => d.toISOString().replace(/[-:]/g,'').replace('.000','');
  const p = new URLSearchParams({
    action: 'TEMPLATE',
    text: title,
    dates: `${fmt(startUtc)}/${fmt(endUtc)}`,
    location,
    details,
    trp: 'false'
  });
  return 'https://calendar.google.com/calendar/render?' + p.toString();
}

function teamById(id) { return TEAMS.find(t => t.id === id); }

function getMatches(id) {
  return MATCHES
    .filter(m => m[0]===id || m[1]===id)
    .map(m => {
      const utc = matchUTC(m);
      const [home,away,,,,venue,city] = m;
      return { homeT: teamById(home), awayT: teamById(away), utc, venue, city };
    })
    .sort((a,b) => a.utc - b.utc);
}

TEAMS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'flag-btn';
  btn.dataset.id = t.id;
  btn.innerHTML = `<span class="fb-flag">${t.flag}</span><span class="fb-name">${t.name}</span>`;
  btn.addEventListener('click', () => selectTeam(t.id));
  grid.appendChild(btn);
});

let cdInterval = null;



function selectTeam(id) {
  document.querySelectorAll('.flag-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.flag-btn[data-id="${id}"]`).classList.add('active');

  const team = teamById(id);
  const matches = getMatches(id);
  const panel = document.getElementById('matchPanel');
  const now = new Date();
  const nextMatch = matches.find(m => m.utc > now);

  let html = `
    <div class="country-header">
      <div class="ch-left">
        <span class="ch-flag">${team.flag}</span>
        <div>
          <div class="ch-name">${team.name}</div>
          <div class="ch-group">Grupo ${team.group} · Mundial 2026</div>
        </div>
      </div>
    </div>
  `;

  matches.forEach((m, i) => {
    const uyTime = fmt(m.utc, UY_OFFSET);
    const { dow, day } = fmtDate(m.utc, UY_OFFSET);
    const title = encodeURIComponent(`⚽ ${m.homeT.name} vs ${m.awayT.name} — Mundial 2026`);
    const endUtc = new Date(m.utc.getTime() + 2*3600*1000);
    const fmtUTC = d => d.toISOString().replace(/[-:]/g,'').replace('.000','');
    const dates = `${fmtUTC(m.utc)}/${fmtUTC(endUtc)}`;
    const loc = encodeURIComponent(`${m.venue}, ${m.city}`);
    const details = encodeURIComponent(`Copa Mundial de la FIFA 2026 · Grupo ${team.group} · Fecha ${i+1}&#10;Hora Uruguay: ${uyTime}&#10;Estadio: ${m.venue}, ${m.city}`);
    const calUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dates}&location=${loc}&details=${details}&trp=false`;
    html += `
      <div class="match-card">
        <div class="match-top">
          <span class="fecha-badge">Fecha ${i+1}</span>
          <div class="match-date"><div class="day">${day}</div><div class="dow">${dow}</div></div>
        </div>
        <div class="teams">
          <div class="team ${m.homeT.id===id?'sel':''}">
            <span class="team-flag">${m.homeT.flag}</span>
            <span class="team-name">${m.homeT.name}</span>
          </div>
          <span class="vs">VS</span>
          <div class="team ${m.awayT.id===id?'sel':''}">
            <span class="team-flag">${m.awayT.flag}</span>
            <span class="team-name">${m.awayT.name}</span>
          </div>
        </div>
        <div class="match-footer">
          <div class="match-time">🕐 ${uyTime} UY</div>
          <div class="match-loc">📍 ${m.city}</div>
        </div>
        <a href="${calUrl}" target="_blank" class="gcal-btn">
          <span class="gcal-icon">📅</span> Agregar al calendario
        </a>
      </div>
    `;
  });

  html += `
    <div class="countdown-box">
      <span class="cd-next" id="cd-next">-</span>
      <div class="cd-label">Faltan</div>
      <div class="cd-grid">
        <div class="cd-item"><span class="cd-num" id="cd-d">--</span><span class="cd-unit">días</span></div>
        <span class="cd-sep">:</span>
        <div class="cd-item"><span class="cd-num" id="cd-h">--</span><span class="cd-unit">hs</span></div>
        <span class="cd-sep">:</span>
        <div class="cd-item"><span class="cd-num" id="cd-m">--</span><span class="cd-unit">min</span></div>
        <span class="cd-sep">:</span>
        <div class="cd-item"><span class="cd-num" id="cd-s">--</span><span class="cd-unit">seg</span></div>
      </div>
    </div>
  `;

  panel.innerHTML = html;

  if (cdInterval) clearInterval(cdInterval);

  function tick() {
    const el = id => document.getElementById(id);
    if (!el('cd-next')) { clearInterval(cdInterval); return; }
    if (!nextMatch) {
      el('cd-next').textContent = '¡Fase de grupos completada!';
      ['cd-d','cd-h','cd-m','cd-s'].forEach(x => el(x).textContent='00');
      clearInterval(cdInterval); return;
    }
    const diff = nextMatch.utc - new Date();
    if (diff <= 0) {
      el('cd-next').textContent = '¡En juego ahora! 🔴';
      ['cd-d','cd-h','cd-m','cd-s'].forEach(x => el(x).textContent='00');
      return;
    }
    const rival = nextMatch.homeT.id === id ? nextMatch.awayT : nextMatch.homeT;
    el('cd-next').textContent = `Próximo: vs ${rival.name}`;
    el('cd-d').textContent = String(Math.floor(diff/86400000)).padStart(2,'0');
    el('cd-h').textContent = String(Math.floor((diff%86400000)/3600000)).padStart(2,'0');
    el('cd-m').textContent = String(Math.floor((diff%3600000)/60000)).padStart(2,'0');
    el('cd-s').textContent = String(Math.floor((diff%60000)/1000)).padStart(2,'0');
  }
  tick();
  cdInterval = setInterval(tick, 1000);
}

// Default
selectTeam('URU');
</script>
</body>
</html>
